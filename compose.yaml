services:
  mongo:
    image: mongo:8.0
    environment:
      # Use per-thread allocator caches on Docker kernels affected by SERVER-121912.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --host
        - 127.0.0.1
        - --quiet
        - --eval
        - >-
          if (db.hello().isWritablePrimary && db.hello().setName === "rs0") quit(0);
          try { rs.status(); }
          catch (error) { if (error.code === 94) rs.initiate({_id:"rs0", members:[{_id:0, host:"mongo:27017"}]}); }
          quit(1);
      interval: 4s
      timeout: 8s
      retries: 20
      start_period: 5s

  web:
    build: .
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        flask --app portal init-db &&
        exec gunicorn --bind 0.0.0.0:3001 --workers 2 --threads 12 --timeout 60 'portal:create_app()'
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request; from urllib.parse import urlsplit;
          origin = urlsplit(os.environ.get('APP_BASE_URL', 'http://localhost:3001'));
          urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:3001/healthz', headers={'Host': origin.netloc}), timeout=4).close()
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 10s

  worker:
    build: .
    env_file: .env
    command: ["flask", "--app", "portal", "invoice-worker"]
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  mongo-data:
